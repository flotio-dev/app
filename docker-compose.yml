services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flotio-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
    restart: unless-stopped
